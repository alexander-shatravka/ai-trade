# Publishes the Stage 1 static pages to GitHub Pages.
# Repository setting: Settings → Pages → Source → GitHub Actions.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; queued runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Assemble _site explicitly instead of publishing the repository root,
      # so build output from apps/ and packages/ never leaks into the site.
      - name: Build _site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          cp -R design _site/design

      # enablement: true turns Pages on via the API with the "GitHub Actions"
      # source, so the deploy does not depend on the manual Settings toggle.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
