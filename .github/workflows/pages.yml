# Publishes the prerendered Nuxt app to GitHub Pages via the gh-pages branch.
#
# The Pages API path (actions/configure-pages + deploy-pages) is deliberately
# not used: this repository's GITHUB_TOKEN is not granted pages: write, so
# creating a Pages deployment fails with "Resource not accessible by
# integration". Pushing the built site to gh-pages needs only contents: write,
# and GitHub's own "pages build and deployment" job publishes from there.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build _site
        # A project site lives at /<repo>/, so the app is generated with that
        # prefix. Reading it from GITHUB_REPOSITORY survives a repo rename.
        run: NUXT_APP_BASE_URL="/${GITHUB_REPOSITORY#*/}/" ./scripts/build-site.sh

      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
